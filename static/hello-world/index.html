<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParallelOS — Digital Twin Control Room | Made by Adarsh Panicker</title>
    <meta name="description" content="ParallelOS Enterprise Digital Twin - One Organization. Infinite Possibilities. Designed and engineered by Adarsh Panicker for Codegeist 2026." />
    <meta name="author" content="Adarsh Panicker" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #090e13;
        background-image: 
          radial-gradient(circle at 10% 15%, rgba(249, 115, 22, 0.16) 0%, transparent 40%),
          radial-gradient(circle at 90% 85%, rgba(16, 185, 129, 0.16) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(234, 88, 12, 0.05) 0%, transparent 60%);
        background-attachment: fixed;
        color: #f1f5f9;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Standalone browser local preview bridge fallback (active only when outside Atlassian Forge iframe)
      if (typeof window !== 'undefined' && !window.__bridge) {
        window.__bridge = {
          callBridge: async function(fn, payload) {
            console.info('[ParallelOS Local Preview] Bridge invocation:', fn, payload);
            if (fn === 'healthCheck') {
              return { status: 'local-preview', timestamp: Date.now() };
            }
            if (fn === 'getGraphData') {
              return { nodes: [], edges: [], totalNodes: 0, totalEdges: 0 };
            }
            if (fn === 'initializeDemoData') {
              return { success: true, entitiesCount: 68, relationshipsCount: 176, executionTimeMs: 12 };
            }
            return { status: 200, body: {} };
          }
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
